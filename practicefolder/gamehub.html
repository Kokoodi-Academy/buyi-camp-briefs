<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub</title>
    <link rel="stylesheet" href="gamehub.css">
</head>
<body>
    <header>
        <h1>GameHub</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#games">Games</a>
            <a href="#create">Create</a>
            <a href="#profile">Profile</a>
        </nav>
 
        <input type="text" placeholder="Search">
    </header>
 
    <div class="layout">
 
        <aside>
            <h2>Menu</h2>
 
            <a href="#home">Home</a>
            <a href="#profile">Profile</a>
            <a href="#games">Games</a>
            <a href="#friends">Friends</a>
            <a href="#avatar">Avatar</a>
        </aside>
 
 
        <main id="home">
 
            <h2>Home</h2>
 
            <section>
                <h3>Recommended Games</h3>
 
                <div class="games">
                   
                    <article>
                        <div class="game-image game-one"></div>
                        <h4>Space Battle</h4>
                        <p>Explore the galaxy</p>
                    </article>
                    <article>
                        <div class="game-image game-two"></div>
                        <h4>Speed Run</h4>
                        <p>Race against other drivers</p>
                    </article>
                    <article>
                        <div class="game-image game-three"></div>
                        <h4>Footy stars</h4>
                        <p>Pack the best football cards</p>
                    </article>
                    <article>
                        <div class="game-image game-four"></div>
                        <h4>Space Battle 2</h4>
                        <p>Explore the galaxy again</p>
                    </article>
                </div>
            </section>
 
        </main>
 
    </div>
   
</body>
</html>
